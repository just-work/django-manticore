name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        manticore-version: ["6.0.4", "29.9.0"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
      - name: Start Manticore ${{ matrix.manticore-version }}
        run: |
          docker run --rm --name manticore -p 127.0.0.1:9306:9306 -d manticoresearch/manticore:${{ matrix.manticore-version }}
          for attempt in $(seq 1 30); do
            if docker exec manticore mysql -N -h 127.0.0.1 -P 9306 -e 'SHOW STATUS' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs manticore
          exit 1
      - name: Test with tox
        run: tox
      - name: Build package
        if: matrix.python-version == '3.10' && matrix.manticore-version == '29.9.0'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
