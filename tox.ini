[tox]
envlist =
    {py3.10,py3.11,py3.12}-django4.2
    {py3.10,py3.11,py3.12}-django5.0
    {py3.10,py3.11,py3.12,py3.13}-django5.1
    {py3.10,py3.11,py3.12,py3.13}-django5.2

[gh-actions]
python =
    3.10: py3.10
    3.11: py3.11
    3.12: py3.12
    3.13: py3.13

[testenv]
basepython =
    py3.10: python3.10
    py3.11: python3.11
    py3.12: python3.12
    py3.13: python3.13
deps =
    -r requirements.txt
    django4.2: Django~=4.2.0
    django5.0: Django~=5.0.0
    django5.1: Django~=5.1.0
    django5.2: Django~=5.2.0
commands =
    python manage.py test
    python manage.py test --parallel
